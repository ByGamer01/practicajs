<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalearTech</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <div class="logo">BalearTech ⚡</div>
        <div class="zona-derecha">
            <span class="contador-fav">❤️ <span id="contador-favoritos">0</span></span>
            <div id="zona-usuario"></div>
        </div>
    </header>

    <main>
        <!-- LOGIN -->
        <section id="seccion-login">
            <h2>Iniciar sesión</h2>
            <form id="form-login">
                <input type="text" id="usuario" placeholder="Nombre de usuario">
                <input type="password" id="password" placeholder="Contraseña">
                <button type="submit">Entrar</button>
                <p id="error-login" class="error"></p>
            </form>
        </section>

        <!-- PRODUCTOS -->
        <section id="seccion-productos">
            <h2>Productos</h2>
            <div class="filtros">
                <input type="text" id="filtro-nombre" placeholder="Buscar por nombre...">
                <select id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                    <option value="Portátiles">Portátiles</option>
                    <option value="Móviles">Móviles</option>
                    <option value="Audio">Audio</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
            </div>
            <div id="listado-productos" class="grid"></div>
        </section>

        <!-- FAVORITOS -->
        <section id="seccion-favoritos">
            <h2>Mis favoritos</h2>
            <div id="lista-favoritos"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 BalearTech — Examen práctico</p>
    </footer>

    <script src="examen.js"></script>
</body>
</html>
