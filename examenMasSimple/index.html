<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PaneraBoom</title>
</head>
<body>

    <header>
        <h1>PaneraBoom 🥖</h1>
        <div id="zona-usuario"></div>
        <a href="#carrito">🛒 <span id="contador">0</span></a>
    </header>

    <main>
        <!-- Sección de login -->
        <section id="seccion-login">
            <h2>Iniciar sesión</h2>
            <form id="form-login">
                <input type="text" id="usuario" placeholder="Usuario">
                <input type="password" id="password" placeholder="Contraseña">
                <button type="submit">Entrar</button>
                <p id="error"></p>
            </form>
        </section>

        <!-- Aquí se pintan los productos -->
        <section>
            <h2>Productos</h2>
            <div id="lista-productos"></div>
        </section>

        <!-- Aquí se pinta el carrito -->
        <section id="carrito">
            <h2>Mi cistella</h2>
            <div id="lista-carrito"></div>
            <button id="btn-vaciar">Vaciar cistella</button>
        </section>
    </main>

    <script src="tienda.js"></script>
</body>
</html>
